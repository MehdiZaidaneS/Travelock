<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1590" viewBox="0 0 1600 1590">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="60" y="48" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#142D42">Travelock visit flow</text>
<text x="60" y="105" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#526779">Signed-in user • QR + new camera photo + reported location within 50 metres</text>
<rect x="520" y="175" width="560" height="105" rx="14" fill="#EAF3FA" stroke="#77A5C5" stroke-width="2"/>
<text x="542" y="193" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#142D42">1  Scan destination QR</text>
<text x="542" y="235" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">VisitQrScanButton returns the exact text.</text>
<rect x="520" y="330" width="560" height="135" rx="14" fill="#EAF3FA" stroke="#77A5C5" stroke-width="2"/>
<text x="542" y="348" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#142D42">2  Start visit on server</text>
<text x="542" y="390" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">startVisit(qrCode) validates the code.</text>
<text x="542" y="420" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Keep the returned VisitAttempt.</text>
<rect x="520" y="495" width="560" height="105" rx="14" fill="#EAF3FA" stroke="#77A5C5" stroke-width="2"/>
<text x="542" y="513" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#142D42">3  Take a live photo</text>
<text x="542" y="555" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">VisitCameraButton • no gallery picker</text>
<rect x="520" y="650" width="560" height="105" rx="14" fill="#EAF3FA" stroke="#77A5C5" stroke-width="2"/>
<text x="542" y="668" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#142D42">4  Get current location</text>
<text x="542" y="710" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Ask for precise foreground location.</text>
<rect x="520" y="805" width="560" height="135" rx="14" fill="#EAF3FA" stroke="#77A5C5" stroke-width="2"/>
<text x="542" y="823" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#142D42">5  Upload or reuse photo</text>
<text x="542" y="865" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Private JPEG up to 10 MiB, or saved path</text>
<text x="542" y="895" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Save the returned path for retries.</text>
<rect x="520" y="970" width="560" height="165" rx="14" fill="#EAF3FA" stroke="#77A5C5" stroke-width="2"/>
<text x="542" y="988" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#142D42">6  Complete visit on server</text>
<text x="542" y="1030" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Check owner, attempt and uploaded photo.</text>
<text x="542" y="1060" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Reported distance must be within 50m.</text>
<text x="542" y="1090" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Errors keep the attempt available to retry.</text>
<rect x="520" y="1165" width="560" height="135" rx="14" fill="#E6F4EC" stroke="#7BAC91" stroke-width="2"/>
<text x="542" y="1183" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#142D42">7  Confirm success</text>
<text x="542" y="1225" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Refresh unlocks, map status and awards.</text>
<text x="542" y="1255" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Clear the saved active checkpoint.</text>
<rect x="520" y="1330" width="560" height="135" rx="14" fill="#E6F4EC" stroke="#7BAC91" stroke-width="2"/>
<text x="542" y="1348" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#142D42">8  Optional: share a post</text>
<text x="542" y="1390" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Separate post photo • completed visit</text>
<text x="542" y="1420" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Friends-only or public to signed-in users</text>
<polyline points="800,280 800,330" fill="none" stroke="#55738A" stroke-width="2.5" />
<polygon points="800,330 794,318 806,318" fill="#55738A"/>
<polyline points="800,465 800,495" fill="none" stroke="#55738A" stroke-width="2.5" />
<polygon points="800,495 794,483 806,483" fill="#55738A"/>
<polyline points="800,600 800,650" fill="none" stroke="#55738A" stroke-width="2.5" />
<polygon points="800,650 794,638 806,638" fill="#55738A"/>
<polyline points="800,755 800,805" fill="none" stroke="#55738A" stroke-width="2.5" />
<polygon points="800,805 794,793 806,793" fill="#55738A"/>
<polyline points="800,940 800,970" fill="none" stroke="#55738A" stroke-width="2.5" />
<polygon points="800,970 794,958 806,958" fill="#55738A"/>
<polyline points="800,1135 800,1165" fill="none" stroke="#55738A" stroke-width="2.5" />
<polygon points="800,1165 794,1153 806,1153" fill="#55738A"/>
<polyline points="800,1300 800,1330" fill="none" stroke="#55738A" stroke-width="2.5" />
<polygon points="800,1330 794,1318 806,1318" fill="#55738A"/>
<rect x="60" y="650" width="350" height="195" rx="14" fill="#FFF4DC" stroke="#D1AD61" stroke-width="2"/>
<text x="82" y="668" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#142D42">Retry</text>
<text x="82" y="710" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Fix permission/location</text>
<text x="82" y="740" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">or the reported error.</text>
<text x="82" y="770" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Reuse an uploaded photo;</text>
<text x="82" y="800" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">get a fresh location fix.</text>
<polyline points="520,700 410,700" fill="none" stroke="#55738A" stroke-width="2.5" />
<polygon points="410,700 422,694 422,706" fill="#55738A"/>
<polyline points="520,1050 455,1050 455,790 410,790" fill="none" stroke="#55738A" stroke-width="2.5" />
<polygon points="410,790 422,784 422,796" fill="#55738A"/>
<polyline points="235,650 235,620 650,620 650,650" fill="none" stroke="#55738A" stroke-width="2.5" stroke-dasharray="8 6"/>
<polygon points="650,650 644,638 656,638" fill="#55738A"/>
<rect x="1160" y="330" width="380" height="210" rx="14" fill="#FFF4DC" stroke="#D1AD61" stroke-width="2"/>
<text x="1182" y="348" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#142D42">Invalid QR</text>
<text x="1182" y="390" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Show the error.</text>
<text x="1182" y="420" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Scan again to start a visit.</text>
<text x="1182" y="450" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">No destination unlock</text>
<text x="1182" y="480" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">is awarded by scanning.</text>
<polyline points="1080,385 1160,385" fill="none" stroke="#55738A" stroke-width="2.5" />
<polygon points="1160,385 1148,391 1148,379" fill="#55738A"/>
<rect x="1160" y="650" width="380" height="210" rx="14" fill="#EAF3FA" stroke="#77A5C5" stroke-width="2"/>
<text x="1182" y="668" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#142D42">Save and return later</text>
<text x="1182" y="710" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Keep attempt + uploaded path</text>
<text x="1182" y="740" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">in the user-scoped checkpoint.</text>
<text x="1182" y="770" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">Restore for the same account.</text>
<text x="1182" y="800" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">JPEG bytes are not stored.</text>
<rect x="1160" y="970" width="380" height="250" rx="14" fill="#FFF4DC" stroke="#D1AD61" stroke-width="2"/>
<text x="1182" y="988" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#142D42">Cancel unfinished visit</text>
<text x="1182" y="1030" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">1. Cancel on the server.</text>
<text x="1182" y="1060" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">2. Delete its photos via Storage.</text>
<text x="1182" y="1090" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">3. Clear the checkpoint.</text>
<text x="1182" y="1120" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">If cleanup fails, keep progress</text>
<text x="1182" y="1150" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#243E50">and retry cancellation.</text>
<text x="1160" y="1260" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#526779">Completed visits cannot be cancelled.</text>
<text x="60" y="1480" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#526779">Enrolment is optional. Sharing is separate. Visit evidence remains private.</text>
<text x="60" y="1520" dominant-baseline="text-before-edge" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#526779">The server checks photo presence and reported GPS; it does not recognize the scene or prove genuine capture/location.</text>
</svg>
